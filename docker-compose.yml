# The whole stack, locally, against a real Postgres.
#
#   ./scripts/smoke.sh     bring it up and prove it works end to end
#   docker compose up      just bring it up
#   docker compose down -v bring it down and wipe the database
#
# The backend used to join the vision container's network namespace
# (network_mode: service:vision) so it could reach the parser on 127.0.0.1
# exactly as it did under ECS awsvpc. ECS is gone (see infra/README.md), so that
# was fidelity to nothing, and it was what made the parser impossible to stop
# deploying: the replicas had no network of their own to fall back on. Ordinary
# service networking now, and `http://vision:8000` by name.
#
# The parser is NOT deployed any more. It is here for local work and its own
# tests; nothing in the app reaches it, see docker-compose.prod.yml.

# Pinned, not derived from the directory. Compose names volumes and containers after the project,
# and the project defaults to whatever the checkout is called, so renaming or cloning the directory
# silently re-keys the database volume and brings the stack up on an empty one. The box already
# runs from a directory called sharpeyes, so this is what it was resolving to there anyway.
name: sharpeyes

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sharpeyes
      POSTGRES_USER: sharpeyes
      POSTGRES_PASSWORD: sharpeyes
    ports:
      - "5432:5432"
    volumes:
      - sharpeyes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharpeyes"]
      interval: 5s
      timeout: 3s
      retries: 10

  vision:
    build: ./vision
    # Opt-in, and this is what keeps it off the box. Removing the service from the prod overlay
    # would NOT have done it: overlays merge, so prod would have inherited this definition and
    # deployed it with `build:` and port 8000 published, which is worse than before. A profile is
    # the only thing that removes a service from `config`, `pull` and `ps` alike.
    #
    # Turned on by COMPOSE_PROFILES in scripts/dev-up.sh and scripts/smoke.sh. deploy.sh sets no
    # profile, so production never sees it.
    profiles: ["parser"]
    volumes:
      # Dev only. smoke.sh POSTs a screenshot from inside the container, so the
      # file has to be there.
      - ./test-fixtures:/screenshots:ro
    ports:
      - "8000:8000" # exposed locally only so a human can poke at it
    healthcheck:
      # Plain urllib rather than curl, which the slim python image does not carry.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth:
    build: ./auth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published because the BROWSER talks to it, not just the backend: sign-in is a redirect the
      # user's browser follows, so localhost has to reach it the same way the frontend does.
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sharpeyes
      DB_USERNAME: sharpeyes
      DB_PASSWORD: sharpeyes
      # Where the browser reaches this service. It goes in the token's `iss` and in every OAuth
      # redirect, so a wrong value here is a sign-in that lands somewhere that does not exist.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-sharpeyes-api}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      # Where a sign-in that went wrong lands, with ?error= on it.
      AUTH_ERROR_URL: ${AUTH_ERROR_URL:-http://localhost:3000/sign-in}
      # Encrypts the signing keys at rest. Change it and every existing key is unreadable, so the
      # service mints a new one and every token in flight fails at once.
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env, any long random string. `openssl rand -base64 32`}
      # No defaults, same reasoning as the backend's JWKS URL below. A placeholder here buys a
      # service that starts, serves a JWKS, and fails every sign-in at Discord instead.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set it in .env, from https://discord.com/developers/applications}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set it in .env, from the same Discord application}
      # Off by default, so Discord is the only way in and nothing here sends email. Set it to true
      # in .env to develop against the password flow: with no RESEND_API_KEY the verification and
      # reset links are printed to this service's log rather than sent, so no mail vendor is needed
      # locally either. `docker compose logs -f auth`.
      AUTH_PASSWORD_LOGIN: ${AUTH_PASSWORD_LOGIN:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-SharpEyes <onboarding@resend.dev>}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        # Only so the first request does not race the key being minted. The keys are cached after
        # one fetch and nothing on the request path talks to auth again.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sharpeyes
      DB_USERNAME: sharpeyes
      DB_PASSWORD: sharpeyes
      # By service name, not loopback: the two no longer share a namespace.
      VISION_SERVICE_URL: http://vision:8000
      # Container-to-container, NOT the browser-facing URL: the backend fetches keys itself and
      # never redirects anyone here, so this stays fixed while AUTH_BASE_URL changes per host.
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      # Both claimed by the token and both checked. These have to match auth's own settings above,
      # and the failure when they do not is a uniform 401 that says nothing about which one is wrong.
      AUTH_ISSUER: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-sharpeyes-api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}

volumes:
  sharpeyes-db-data:
