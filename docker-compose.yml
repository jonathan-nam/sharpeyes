# The whole stack, locally. This is the pre-production environment: it runs the
# same two images ECS runs, wired the same way, against a real Postgres.
#
#   ./scripts/smoke.sh     bring it up and prove it works end to end
#   docker compose up      just bring it up
#   docker compose down -v bring it down and wipe the database
#
# Fidelity is the point. The backend joins the vision container's *network
# namespace* (network_mode: service:vision), which is exactly what ECS does under
# awsvpc, so the backend reaches the vision service on 127.0.0.1 here for the
# same reason it does in production, and the vision port is not reachable from
# outside either. A compose file that put them on separate networks and talked
# over `http://vision:8000` would look fine and quietly fail to test the thing
# that actually has to work.
#
# Consequences of sharing the namespace, which are the same in ECS:
#   - published ports live on the vision service, since it owns the namespace
#   - the backend cannot declare `ports:` of its own
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: maplestorage
      POSTGRES_USER: maplestorage
      POSTGRES_PASSWORD: maplestorage
    ports:
      - "5432:5432"
    volumes:
      - maplestorage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maplestorage"]
      interval: 5s
      timeout: 3s
      retries: 10

  vision:
    build: ./vision
    volumes:
      # Dev only. The vision service binds 127.0.0.1 (as it does in ECS), so it
      # is deliberately unreachable from the host, the smoke test POSTs a
      # screenshot from inside the container instead, and needs the file there.
      - ./test-fixtures:/screenshots:ro
    # Owns the shared namespace, so both services' ports are published here.
    ports:
      - "8080:8080" # backend (Ktor)
      - "8000:8000" # vision  (exposed locally only so a human can poke at it)
    healthcheck:
      # The same command infra/ecs.tf uses, so a health check that passes here
      # is the one that will run in production.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth:
    build: ./auth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published because the BROWSER talks to it, not just the backend: sign-in is a redirect the
      # user's browser follows, so localhost has to reach it the same way the frontend does.
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: maplestorage
      DB_USERNAME: maplestorage
      DB_PASSWORD: maplestorage
      # Where the browser reaches this service. It goes in the token's `iss` and in every OAuth
      # redirect, so a wrong value here is a sign-in that lands somewhere that does not exist.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-sharpeyes-api}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      # Encrypts the signing keys at rest. Change it and every existing key is unreadable, so the
      # service mints a new one and every token in flight fails at once.
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env, any long random string. `openssl rand -base64 32`}
      # No defaults, same reasoning as the backend's JWKS URL below. A placeholder here buys a
      # service that starts, serves a JWKS, and fails every sign-in at Discord instead.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set it in .env, from https://discord.com/developers/applications}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set it in .env, from the same Discord application}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    # Same namespace as vision -> 127.0.0.1 reaches it, exactly as under awsvpc.
    network_mode: "service:vision"
    depends_on:
      postgres:
        condition: service_healthy
      vision:
        # Mirrors the ECS container dependency: never start the backend before
        # the parser is up, or every upload in that window fails.
        condition: service_healthy
      auth:
        # Only so the first request does not race the key being minted. The keys are cached after
        # one fetch and nothing on the request path talks to auth again.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: maplestorage
      DB_USERNAME: maplestorage
      DB_PASSWORD: maplestorage
      VISION_SERVICE_URL: http://127.0.0.1:8000
      # Container-to-container, NOT the browser-facing URL: the backend fetches keys itself and
      # never redirects anyone here, so this stays fixed while AUTH_BASE_URL changes per host.
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      # Both claimed by the token and both checked. These have to match auth's own settings above,
      # and the failure when they do not is a uniform 401 that says nothing about which one is wrong.
      AUTH_ISSUER: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-sharpeyes-api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}

volumes:
  maplestorage-db-data:
