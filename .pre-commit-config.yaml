# Hooks call each project's own tool (Gradle plugin / pnpm devDependency / Terraform CLI)
# rather than a pre-commit-hosted mirror, so the enforced version always matches what's
# declared in that project. No separate version to keep in sync.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: local
    hooks:
      - id: ktlint-detekt
        name: ktlint + detekt (backend)
        # The backend's checks reach the included shared builds too (backend/build.gradle.kts).
        entry: bash -c 'cd backend && ./gradlew ktlintCheck detekt'
        language: system
        files: ^(backend|shared/money|shared/api|shared/planning)/.*\.kts?$
        pass_filenames: false

      # Neither eslint nor the build checks types, so this is the only thing that does. A type
      # error in a test file rode to master green before it existed.
      - id: typecheck
        name: tsc (frontend)
        entry: bash -c 'cd frontend && pnpm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: eslint-prettier
        name: eslint + prettier (frontend)
        entry: bash -c 'cd frontend && pnpm run lint && pnpm exec prettier --check .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      # The redemption rules are the one place in this app where a "simplification" that looks
      # like arithmetic ships a confident wrong number. They are cheap to check and expensive to
      # rediscover, so they are checked on every commit that touches the frontend.
      - id: vitest
        name: vitest (frontend)
        entry: bash -c 'cd frontend && pnpm test'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: catalog
        name: catalog is in sync (items/bosses/drops.yaml -> generated SQL)
        entry: python3 catalog/build.py --check
        language: system
        files: ^(catalog/|vision/app/cv/templates/|backend/src/main/resources/seed-assets/)
        pass_filenames: false

      - id: ruff
        name: ruff (vision)
        entry: bash -c 'cd vision && ruff check . && ruff format --check .'
        language: system
        files: ^vision/.*\.py$
        pass_filenames: false

      - id: terraform-fmt-validate
        name: terraform fmt + validate (infra)
        entry: bash -c 'cd infra && terraform fmt -check -recursive && terraform validate'
        language: system
        files: ^infra/.*\.tf$
        pass_filenames: false

      - id: tflint
        name: tflint (infra)
        entry: bash -c 'cd infra && tflint --recursive'
        language: system
        files: ^infra/.*\.tf$
        pass_filenames: false
