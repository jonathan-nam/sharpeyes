name: CI

# Runs on pull requests and pushes to master. Uses a paths-filter job rather
# than top-level `on.paths` filtering deliberately: top-level path filters
# would make this workflow simply not trigger on PRs that don't touch a
# given path, which breaks GitHub's required-status-check semantics (a
# required check that never runs leaves the PR stuck waiting on it forever).
# This pattern keeps the workflow always triggering, with irrelevant jobs
# cleanly skipping instead.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API's listFiles on pull_request
    # events (not a local git diff), which needs pull-requests: read on
    # GITHUB_TOKEN. Without it, this fails with "Resource not accessible
    # by integration" rather than anything path-related. Scoped to just this
    # job, not loosened repo-wide. Job-level `permissions:` isn't additive to
    # the default set. Declaring any key switches this job to explicit
    # mode, so contents: read (which actions/checkout needs) has to be
    # listed too, not just the new pull-requests grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      vision: ${{ steps.filter.outputs.vision }}
      catalog: ${{ steps.filter.outputs.catalog }}
      auth: ${{ steps.filter.outputs.auth }}
    steps:
      - uses: actions/checkout@v4

      # This repo is public, so a tracked .env is the one mistake that cannot be undone by a
      # revert. The .gitignore block is not enforcement: `git add -f` walks past it, and so does a
      # pattern that stops matching. Both checks live in this job because it is the only one that
      # always runs, and a PR that adds a .env touches none of the paths the others filter on.
      - name: No secret files committed
        run: |
          # Anchored on purpose: an unanchored `\.env` also matches a stray .envrc, and a check
          # that cries wolf gets weakened rather than obeyed.
          leaked=$(git ls-files \
            | grep -E '(^|/)(\.env|terraform\.tfvars|backend\.hcl)(\.[^/]*)?$|(^|/)\.clerk/|\.(pem|key)$|(^|/)id_(rsa|ed25519)' \
            | grep -v '\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::secret-carrying files are tracked in a PUBLIC repo:"
            echo "$leaked"
            exit 1
          fi
          echo "no secret-carrying files tracked"

      - name: Env files stay gitignored
        run: |
          for f in .env .env.prod .env.local .env.production backend/.env backend/.env.prod \
                   frontend/.env.local frontend/.env.production auth/.env auth/.env.prod \
                   vision/.env infra/terraform.tfvars infra/backend.hcl \
                   LightsailDefaultKey-us-east-1.pem deploy.pem id_rsa infra/id_ed25519; do
            if ! git check-ignore -q "$f"; then
              echo "::error::$f is not gitignored"
              exit 1
            fi
          done
          # The negation that keeps the templates committable. Lose it and the deploy runbook's
          # first step stops working, which is the failure that argues for weakening the rule above.
          for f in .env.prod.example backend/.env.example frontend/.env.local.example; do
            if git check-ignore -q --no-index "$f"; then
              echo "::error::$f is gitignored but must stay committable"
              exit 1
            fi
          done
          echo "env ignore rules hold"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Editing this file has to run the jobs it defines. Without this every filter below
            # says no to a workflow-only commit, so a change to what a job RUNS merges without
            # that job ever running it. `next build` landed that way in #500.
            #
            # An anchor rather than six copies: paths-filter parses this block as YAML and
            # flattens a referenced list into the filter naming it. It also means an unused
            # `workflow` filter and output exist, which nothing reads.
            workflow: &workflow
              - '.github/workflows/ci.yml'
            backend:
              - *workflow
              # The reusable workflow that holds this job's actual commands.
              - '.github/workflows/backend-verify.yml'
              - 'backend/**'
              # The backend's build includes the shared modules, and reads the version catalog and the
              # detekt config from beside it.
              - 'shared/money/**'
              - 'shared/api/**'
              - 'shared/planning/**'
              - 'gradle/libs.versions.toml'
              - 'config/detekt/**'
              # GeneratedTypesTest compares this to what shared/api renders, so a hand edit fails here.
              - 'frontend/types/generated/api.ts'
            frontend:
              - *workflow
              - 'frontend/**'
              # One Drop Log tab mark is a catalog drop, and build-tab-marks.mjs takes its sprite id
              # out of this file rather than repeating it. lib/tab-marks.test.ts reads it too, so a
              # change here has to run this job.
              - 'catalog/drops.yaml'
              # The golden tests read and write the fixtures the shared modules replay.
              - 'shared/money/src/commonTest/resources/money-golden/**'
              - 'shared/planning/src/commonTest/resources/planning-golden/**'
              # The composite tests read the page responses they must agree with.
              - 'shared/api/src/commonMain/kotlin/com/sharpeyes/api/pages/**'
            auth:
              - *workflow
              - 'auth/**'
            infra:
              - *workflow
              - 'infra/**'
            # The catalog generates the backend's seed migration and names the vision templates,
            # so a change to it must re-run both checks, not just its own.
            vision:
              - *workflow
              - 'vision/**'
              - 'catalog/**'
              - 'test-fixtures/**'
              # The seed art vision/tests reads: the boss portraits it re-cuts, and the drop icons
              # it checks are registered. Without this an art-only change skips both.
              - 'backend/src/main/resources/seed-assets/**'
            catalog:
              - *workflow
              - 'catalog/**'
              - 'backend/src/main/resources/db/migration/R__token_catalog.sql'
              - 'backend/src/main/resources/db/migration/R__drop_catalog.sql'
              # The art build.py validates. An icon-only change skipped this job, which is how a
              # 37x37 drop icon shipped into a 46px box and was stretched 1.24x for months.
              - 'backend/src/main/resources/seed-assets/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-verify.yml

  # The image a deploy runs, built as publish-images.yml builds it but not pushed. Tests run on
  # Gradle's classpath, not the image, so a Dockerfile that misses a module (#831 shipped one) passed
  # every check and broke only the publish after merge.
  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          # Reads the cache publish-images writes, and writes none, so a PR cannot change what master
          # builds from.
          cache-from: type=gha,scope=backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Before setup-node, which needs pnpm on PATH to resolve the store for its cache.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Nothing here type-checked until 2026-07-26, so a type error reached master with the job
      # green: lint does not do it. `next build` below now does, but only over the build graph,
      # and test files sit outside it, which is exactly where the one that got through was.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      # The redemption rules. Three ways to produce a confidently wrong number, each of which
      # looks like arithmetic. See lib/redemption.test.ts.
      - run: pnpm test
      # Vercel is otherwise the FIRST machine to run this. The frontend is not containerised and
      # deploys itself from a push to master, so a breakage that only a build catches would merge
      # green and surface as a red deployment. Last, because it is the slowest step here.
      #
      # Deliberately no NEXT_PUBLIC_* set: the build does not need them, and leaving them unset
      # means a page that starts fetching at build time fails this job rather than baking one
      # user's data into prerendered HTML.
      - run: pnpm run build

  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: auth/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: auth/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build, not just a type check: the Dockerfile runs the same command, so a service that
      # compiles here is one the box can start.
      - run: pnpm run build

  # The CV regression corpus: the highest-risk code in the repo, and until now it ran only in a
  # pre-commit hook, so a PR from a machine without hooks installed merged it unchecked.
  vision:
    needs: changes
    if: needs.changes.outputs.vision == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vision/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest tests -q

  # catalog/items.yaml is the single source of truth. If it and the generated SQL disagree, the
  # catalog silently stops meaning anything, which is the drift the manifest exists to end.
  catalog:
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 catalog/build.py --check

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      # -backend=false: this job only lints/validates, it never touches
      # infra/terraform.tfstate or needs AWS credentials at all.
      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.63.1"
      - run: tflint --init
      - run: tflint --recursive

  # The single required status check. Branch protection requires this one job, not the matrix
  # jobs above. Each of those runs only when its paths change (a frontend-only PR skips backend,
  # vision, etc.), so requiring them individually is unsafe: a check that was skipped rather than
  # run is not a guaranteed pass, and that gap is how backend/verify sat red-but-hidden from #36.
  # This gate always runs and fails only when a job that ACTUALLY ran came back failed or
  # cancelled; a skipped upstream job counts as a pass. Add every new CI job to `needs`, or it
  # merges unenforced.
  required-checks:
    needs: [changes, backend, backend-image, frontend, auth, vision, catalog, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        # RESULTS is one word per needs job, from the fixed set success/failure/cancelled/skipped.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required CI job did not pass: $RESULTS"
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs passed or were skipped."
