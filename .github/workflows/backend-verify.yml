name: Backend verify

# Reusable job. Called by ci.yml (PR/push gate) and deploy-backend.yml
# (which stays self-contained rather than assuming ci.yml already ran
# against this exact commit). Runs the same ktlintCheck/detekt commands
# .pre-commit-config.yaml uses locally, plus the JUnit5 suite (skipped in
# pre-commit for local-loop speed, but worth the time in CI).

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Real Postgres, not a mock. TokenCatalogSeedTest runs Flyway's actual
    # migrate() against it, which doubles as an implicit "migrations apply
    # cleanly" check on every run. Same DB_* contract as the root docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sharpeyes
          POSTGRES_USER: sharpeyes
          POSTGRES_PASSWORD: sharpeyes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            shared/money/*.gradle*
            shared/api/*.gradle*
            gradle/libs.versions.toml

      - name: ktlint + detekt + test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: sharpeyes
          DB_USERNAME: sharpeyes
          DB_PASSWORD: sharpeyes
        run: ./gradlew ktlintCheck detekt test --no-daemon
