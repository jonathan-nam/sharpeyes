# Production overlay for the single box. Never used locally.
#
#   ./deploy.sh
#
# nginx is the only thing the internet can reach. It terminates TLS and load-balances across two
# backend replicas. Everything else loses the ports the base file publishes for local development.
#
# The certificates are certbot's job, in two more containers: one to break the start-up cycle and
# one to obtain and renew. Caddy did all of that by itself, in nothing. That is the trade this made
# knowingly, and the renewal loop is the part that has to be watched, because it fails silently and
# the consequence arrives 90 days later.
#
# Images are built by .github/workflows/publish-images.yml and pulled by tag, never built here. The
# box has 2 vCPUs, and a Gradle compile on them makes the running site slow for the length of the
# build, which is not downtime but is the thing you would notice.
#
# IMAGE_TAG is the commit SHA, set by deploy.sh from the checkout. Pinning it to the commit is what
# makes rollback work: `git checkout <old-sha> && ./deploy.sh` pulls that commit's images. A
# floating `latest` would check out old code and run the new binary.
#
# `ports: !reset []` is the load-bearing line here, not decoration. Compose MERGES `ports` across
# files rather than replacing them. Without the reset, the base file's 5432 and 8000 stay published
# on the host, which puts the database and the parser on the public internet behind nothing at all.
# Requires Compose v2.24+ for the !reset tag.

# The prod-only backend settings, shared by both replicas. Anchored rather than repeated: a new
# variable added to one replica and not the other is a box where half the requests work.
x-backend-prod-env: &backend-prod-env
  DB_USERNAME: ${DB_USERNAME:?set it in .env on the box}
  DB_PASSWORD: ${DB_PASSWORD:?set it in .env on the box}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?the frontend's origin, e.g. https://sharpeyes.app}
  # Has to be character-for-character what the auth service puts in `iss`, which is why both read
  # the same API_DOMAIN. A trailing slash on one side and not the other is a uniform 401.
  AUTH_ISSUER: https://${API_DOMAIN:?the API hostname, e.g. api.sharpeyes.app}

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    environment:
      # The base file's password is the literal "sharpeyes", which is correct for a throwaway
      # local database and unacceptable for one holding somebody's account data.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set a real one in .env on the box}

  # The parser is deliberately absent. Nothing in the app reaches it: the two components that
  # posted to /api/screenshots are not mounted anywhere, and the landing copy stopped offering the
  # feature in #474. It stays in the repo and in local development, it just does not run here.
  #
  # Removing it was only possible once the backend stopped living inside its network namespace.
  # That is also why deploy.sh no longer has a branch for "the parser was replaced, so both
  # replicas are stranded and this is the one deploy with downtime".

  auth:
    image: ghcr.io/jonathan-nam/sharpeyes-auth:${IMAGE_TAG:?deploy.sh sets this. Any value works for exec/logs/ps}
    build: !reset null
    # Reached only through nginx, which routes /api/auth/* here. The base file publishes 3001 for
    # local development; on the box nothing but nginx may talk to it.
    ports: !reset []
    restart: unless-stopped
    environment:
      DB_USERNAME: ${DB_USERNAME:?set it in .env on the box}
      DB_PASSWORD: ${DB_PASSWORD:?set it in .env on the box}
      # The frontend's origin, because the browser signs in there: Vercel proxies /api/auth/* to
      # this service (frontend/next.config.ts). It lands in the OAuth redirect, so Discord sends
      # people back to sharpeyes.app. Chrome flagged the old callback on api. as phishing.
      AUTH_BASE_URL: ${FRONTEND_ORIGIN:?the frontend's origin, e.g. https://sharpeyes.app}
      # What `iss` says, which the backend's AUTH_ISSUER above checks character for character.
      AUTH_ISSUER: https://${API_DOMAIN:?the API hostname, e.g. api.sharpeyes.app}
      # Where a sign-in that went wrong lands, with ?error= on it.
      AUTH_ERROR_URL: ${FRONTEND_ORIGIN:?the frontend's origin, e.g. https://sharpeyes.app}/sign-in
      # Scoped to the parent so the frontend on the apex and this service on api. share one session.
      # A leading dot, and never a bare subdomain, or the apex does not get the cookie.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?the parent domain with a leading dot, e.g. .sharpeyes.app}
      AUTH_TRUSTED_ORIGINS: ${FRONTEND_ORIGIN:?the frontend's origin, e.g. https://sharpeyes.app}
      # Discord only until this is true. Turning it on REQUIRES a mail sender and the service
      # refuses to start without one: a password nobody can reset is an account that can be lost
      # for good. Nothing else changes, and no migration is needed, V66 already has the columns.
      AUTH_PASSWORD_LOGIN: ${AUTH_PASSWORD_LOGIN:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}

  # Replica A, on 8080, as the base file already has it.
  #
  # Nothing published to the host. nginx reaches it over the compose network by name, so the API
  # is not on the box's public IP at all. The base file publishes 8080 for local development, and
  # inheriting that here would sit an unencrypted API beside nginx on port 8080.
  backend:
    image: ghcr.io/jonathan-nam/sharpeyes-backend:${IMAGE_TAG:?deploy.sh sets this. Any value works for exec/logs/ps}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment: *backend-prod-env

  # Replica B, so a deploy has somewhere to send traffic while A restarts. Two containers on the
  # compose network now, which is why nginx's upstream block names `backend:8080 backend-b:8081`.
  #
  # `extends` rather than a second copy: it inherits the base file's environment block, so a new
  # variable there reaches both replicas. It does NOT inherit the prod overlay's own additions to
  # `backend` (extends reads one file), hence the anchor above, and it drops `depends_on`, hence
  # the explicit one below.
  backend-b:
    extends:
      file: docker-compose.yml
      service: backend
    image: ghcr.io/jonathan-nam/sharpeyes-backend:${IMAGE_TAG:?deploy.sh sets this. Any value works for exec/logs/ps}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      <<: *backend-prod-env
      PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot. Writes a self-signed placeholder if there is no certificate yet, so nginx can start
  # and answer the challenge that gets the real one. See nginx/bootstrap-cert.sh for why the cycle
  # needs breaking at all; Caddy did not have this problem.
  cert-init:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "/bootstrap-cert.sh"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?the API hostname, e.g. api.sharpeyes.app}
    volumes:
      - ./nginx/bootstrap-cert.sh:/bootstrap-cert.sh:ro
      - letsencrypt:/etc/letsencrypt

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?the API hostname, e.g. api.sharpeyes.app}
    volumes:
      # The image's own entrypoint runs envsubst over anything in templates/ before starting, which
      # is how ${API_DOMAIN} gets into the config.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      # Certificates live here. Lose this volume and certbot re-requests from Let's Encrypt, which
      # rate-limits (5 failures per account per hostname per hour), so a restart loop can lock you
      # out of your own certificate. It is a named volume for exactly that reason.
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # Reloads itself every six hours to pick up a renewed certificate. certbot cannot signal it,
    # they are separate containers, and this is the standard way round that. The `wait $${!}` is so
    # a `docker compose stop` is not held up for six hours by the sleep.
    # /docker-entrypoint.sh FIRST, and it is not decoration. The nginx image only runs its
    # envsubst-over-templates step when $$1 is `nginx`, and this command's $$1 is `/bin/sh`. Without
    # it the template is never rendered, nginx serves the image's stock default.conf, and the first
    # deploy came up on server_name localhost with no 443 listener at all. It answered port 80 with
    # a 404, which reads as a routing mistake rather than a config that was never loaded.
    # `nginx -t` is just a cheap command for the entrypoint to exec once the rendering is done.
    command: >-
      /bin/sh -c '/docker-entrypoint.sh nginx -t;
      while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    depends_on:
      cert-init:
        condition: service_completed_successfully
      # Both, because the upstream block resolves their names at start-up and nginx refuses to
      # start if either does not. auth is deliberately NOT here: it is reached through a variable
      # upstream precisely so it does not have to exist first.
      backend:
        condition: service_started
      backend-b:
        condition: service_started

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?the API hostname, e.g. api.sharpeyes.app}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?an address to register the ACME account with, see .env.prod.example}
    volumes:
      - ./nginx/certbot-loop.sh:/certbot-loop.sh:ro
      # Also mounted here, not just in cert-init: the loop puts the placeholder BACK when issuance
      # fails, so a recreated nginx still has something to start with.
      - ./nginx/bootstrap-cert.sh:/bootstrap-cert.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started

volumes:
  letsencrypt:
  certbot-webroot:
