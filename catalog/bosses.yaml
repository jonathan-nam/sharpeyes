    hp: {NORMAL: 6.48Q, HARD: 12.55Q}
    max_party: 3
  - key: baldrix
    name: Baldrix
    reset: WEEKLY
    difficulties: [NORMAL, HARD]
    hp: {NORMAL: 9.06Q, HARD: 20.34Q}
    max_party: 3
  # After Baldrix, which is where the planner puts it (test-fixtures/planner/boss portraits
  # sample.png). Until now it was missing here entirely, so its planner row matched no name and
  # counted as UNREADABLE, which is what makes a parse warn that it may have missed a boss.
  - key: jupiter
    name: Jupiter
    reset: WEEKLY
    difficulties: [NORMAL, HARD]
    hp: {NORMAL: 10.26Q, HARD: 49.40Q}
    max_party: 3
