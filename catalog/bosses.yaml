    max_party: 3
  - key: kaling
    name: Kaling
    reset: WEEKLY
    difficulties: [EASY, NORMAL, HARD, EXTREME]
    hp: {EASY: 921T, NORMAL: 3.93Q, HARD: 11.84Q, EXTREME: 54.59Q}
    max_party: 6
  - key: malefic-star
    name: Malefic Star
    short: Star
    reset: WEEKLY
    difficulties: [NORMAL, HARD]
    hp: {NORMAL: 3.26Q, HARD: 14.70Q}
    max_party: 3
  - key: limbo
    name: Limbo
