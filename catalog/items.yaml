  # things here. Inside the silhouette the capture IS the colour, dark shading and all; outside it
  # the halo arrives premultiplied and divides back out into real alpha. Keying the whole sprite off
  # brightness, the way Blissful Nightmare's glow was, would have holed that shading, and the slot
  # behind it is light. What the black did take is the outline, which no sibling shares here.
