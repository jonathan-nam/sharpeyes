# The item catalog. This file is the source of truth.
#
# An item used to live in four places at once, the vision template, the backend's
# icon asset, the V2 seed migration, and the V4 vision_key mapping, and nothing
# checked that the four agreed. They didn't: the parser emitted slugs while the
# lookup matched display names, so every token count was silently dropped for days.
# The bug was not the mismatch. The bug was that a mismatch was *possible*.
#
# So: one entry per item, and `catalog/build.py` generates the rest. Run
#
#     python catalog/build.py            # regenerate
#     python catalog/build.py --check    # fail if anything is out of sync (pre-commit)
#
# `key` is the identifier. It names the vision template (vision/app/cv/templates/
# token-<key>.png), the icon asset (backend/.../seed-assets/tokens/<key>.png), and the
# token_catalog.vision_key column. It must never change without renaming those with it
#, which is exactly what build.py checks.
#
# A VISION TEMPLATE IS OPTIONAL. It used to be required, and that requirement was the entire cost
# of adding an item: a capture, a hand cut, and a process nobody had written down. So an item the
# parser could not read was an item the app could not be told about at all, which is why four
# Eternal fragments and Jupiter's token sat in catalog/drops.yaml as bare drops for weeks.
#
# An item without one is simply not readable off a capture. Its count is typed instead. What
# build.py still refuses is a template the manifest does not know about, which is an item the
# parser can detect and the app cannot name.
#
# `icon_id` is the maplestory.io item id the picture comes from, and `art: cut` says it was cut by
# hand for an item the pinned dataset does not carry. Neither is required either: an item with no
# picture is drawn as an empty slot, which is honest, and is what the drop side has always done.
#
# `name` is prose for humans, and can be reworded freely.
#
# `redeem_slots` is which Eternal pieces a token can be traded for. It is not cosmetic: the two
# sets do not overlap, so ten Kalos pieces and ten Limbo pieces are not "twenty pieces". They
# buy different things. It lived only in the V7 migration, which meant the manifest did not own it
# and the names had already drifted apart ("Shoes, Gloves" in one row, "Shoe, Glove" in another).
# That is exactly the four-places-one-truth drift this file exists to prevent.
#
# `group` is how the inventory is SECTIONED in the UI. "Eternal Pieces", "Symbols",
# "Consumables". It is a real field rather than something the frontend infers from the key,
# because inference would quietly mis-sort the first item whose name did not fit the pattern,
# and it would do so silently. It is also NOT the same axis as `category`: category says what an
# item IS to the backend (does redemption apply to it), group says where a human expects to find
# it. Symbols and elixirs are both CONSUMABLE and nobody looks for them in the same place.
#
# `per_clear` is how many of this item one clear puts in ONE character's inventory, by the boss's
# difficulty, as `{ interactive: N, heroic: M }` or a bare N for both worlds. It is what the
# inventory's auto sync adds when a clear is ticked. Validated by hand against the game; web
# sources were wrong repeatedly, so never derive one world's figure from the other's.
#
# Every difficulty of the boss is listed by exactly one of its items, and `0` is how "drops none"
# is said. build.py refuses a gap, so a mode nobody counted cannot read as a mode that drops none.
#
# `per_member` says who that count goes to, in drops.yaml's terms. ALWAYS: each character gets
# their own. HEROIC: one pile for the whole party in Interactive, so the Interactive figure is only
# one character's when they ran it alone.

