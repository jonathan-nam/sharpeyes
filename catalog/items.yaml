  # Symbol coupons, earned from dailies and spent to grow a symbol. They are consumables,
  # not redemption tokens: nothing is traded in at a threshold, so there is no rule for them.
  #
  # Two things about these are worth knowing before touching them.
  #
  # Shape does NOT sort them into Arcane and Sacred. Six of the thirteen icons in the
  # reference capture are round orbs and seven are hexagons, which looks like exactly that
  # split until you notice Shangri-La (a SACRED symbol) is one of the orbs. The families
  # are a naming fact, not a visual one, and the only reason this catalog is right is that a
  # human read the names off the tooltips.
  #
  # Each coupon exists in a tradeable and an untradeable version, and they share one icon.
  # They differ only by the cyan untradeable bar along the bottom of the slot, which the
  # template mask excludes as per-item state rather than identity, so ONE entry matches both
  # (verified: a template cut from the untradeable Tallahart scores 1.000 against the
  # tradeable one). That is why the parser sums an item found in more than one slot.
  #
  - key: arcane-vanishing-journey
