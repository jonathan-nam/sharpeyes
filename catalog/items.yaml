  # --- Fragments ---------------------------------------------------------------------
  # Half a piece each: two make one of the tokens above, so TWENTY buy one Eternal piece. That is
  # what the threshold says, and it is why they are their own items rather than a smaller count of
  # the same one. The lower difficulties of the four pooled bosses drop these and the upper ones
  # drop the token itself, so a boss has both and never at the same mode.
  #
  # The names are not derivable from the token's. Kaling's fragment drops the "Beast", and the
  # Adversary's is a Whisper where the token is an Echo. Confirmed against maplestory.io's own
  # names, not guessed.
  #
  # None of these has a vision template, which is now allowed: their counts are typed. That is the
  # whole reason they can be items at all, having sat in catalog/drops.yaml as bare drops until the
  # template requirement was lifted.
  - key: kalos-residual-determination-fragment
