# The boss drop tables. Source of truth for what a boss can drop, and the art shown beside it.
#
# `catalog/build.py` generates the backend seed (R__drop_catalog.sql) and downloads the official
# icons into backend/src/main/resources/seed-assets/drops/. Same rules as items.yaml:
#
#     python catalog/build.py                 regenerate
#     python catalog/build.py --check         fail if the generated seed is stale
#     python catalog/build.py --fetch-icons   re-download the official art
#
# `key` is the identifier. It names the icon asset (seed-assets/drops/<key>.png) and the
# drop_catalog.drop_key column, so renaming one renames the other two.
#
# `name` is the in-game display name as maplestory.io has it, which is not always how a player
# says it: the game calls it "Exceptional Hammer (Face Acc)", not "(Face Accessory)".
#
# `icon_id` is the Nexon item id the art comes from, read from GMS v268 (ICON_VERSION) unless
# `icon_version` names a later one (269 for items v268 predates). Absent
# means no dataset the mirror serves has the item, and the drop is drawn without art rather than
# with somebody else's.
#
# `per_member` marks a drop each member receives their own copy of: ALWAYS, or HEROIC when it is
# one drop for the party in Interactive worlds and one each in Heroic/Reboot. It is the one flag
# here that changes a NUMBER: a per-member drop is not pooled, so splitting one six ways would pay
# everybody a sixth of something they each already have. The loot pool says so on the row.
#
# `worlds` narrows a drop to where it exists at all: INTERACTIVE, for one that does not drop in
# Reboot. Absent means everywhere, which is every drop in the file today.
#
# `fungible` marks a drop whose copies are interchangeable, so a pile of them is sold as one lot at
# a going rate and WHICH of them went is not a fact anybody has. It is what lets a sale be entered
# once against a queue of rows instead of row by row: the oldest unsold rows are proposed, and you
# confirm them. Absent means the drop is sold one at a time, which is the only honest input for a
# thing with its own potential lines and its own price.
#
# Flags sit on the item rather than on the (boss, item) pair because nothing in these tables
# behaves differently per boss. Move one down to `tables` the day that stops being true.
#
# That day arrived for `pieces`. How many vestige coupons a boss drops is per (boss, difficulty),
# not per item, so a table entry may be a mapping instead of a bare key:
#
#     - key: vestige-of-erion
#       pieces:
#         EXTREME: { total: 180, bundles: 6 }
#
# It fills the count when a drop is logged, so the number is one somebody can correct rather than
# one they have to remember. Only the difficulties listed drop any; a difficulty left out fills
# nothing, which is not the same as filling zero.
#
# `pieces` is a POOLED count, so it is an INTERACTIVE one. Reboot instances every piece it drops:
# each member is handed their own, and however many that is, it is not the size of a pile nobody
# there receives. Writing this number to both worlds is what had a Heroic party dividing 180 coupons
# six ways.
#
# `bundles` is how many separate stacks that total falls in. Stacks are indivisible, so it is what
# decides whether a party can split a drop by looting alone: three of them between two people
# leaves one holding half a stack that is not theirs. Static per (boss, difficulty), not a function
# of how many turned up. build.py refuses a total that does not divide by it.
#
# A bare count is still accepted, for a drop whose bundling nobody has counted. That is not the
# same as saying it falls in one stack.

drops:
  # --- Brilliant Boss Set, one accessory per boss -------------------------------------
  # Five pieces, in release order. Each drops from one boss and nowhere else, so a boss has at
  # most one of them.
  - key: whisper-of-the-source
    name: Whisper of the Source
    icon_id: 1113341
  - key: oath-of-death
    name: Oath of Death
    icon_id: 1122447
  - key: immortal-legacy
    name: Immortal Legacy
    icon_id: 1143471
  - key: blissful-nightmare
    name: Blissful Nightmare
    icon_id: 1113360
    icon_version: 269
  - key: original-sin-of-pride
    name: Original Sin of Pride
    icon_id: 1012911
    icon_version: 269

  # --- Pitched Boss Set --------------------------------------------------------------
  # One piece per boss from Lotus to Darknell, Lotus excepted with two. Guardian Angel Slime drops
  # none. Will drops the selection box rather than one of its four spellbooks, as Seren does
  # Mitra's Rage.
  - key: berserked
    name: Berserked
    icon_id: 1012632
  - key: total-control
    name: Total Control
    icon_id: 1672095
  - key: magic-eyepatch
    name: Magic Eyepatch
    icon_id: 1022278
  - key: dreamy-belt
    name: Dreamy Belt
    icon_id: 1132308
  - key: wills-cursed-spellbook-selection-box
    name: Will's Cursed Spellbook Selection Box
    icon_id: 2633926
  - key: endless-terror
    name: Endless Terror
    icon_id: 1113306
  - key: source-of-suffering
    name: Source of Suffering
    icon_id: 1122430
  - key: commanding-force-earring
    name: Commanding Force Earring
    icon_id: 1032316

  # --- Badges ------------------------------------------------------------------------
  # The mirror 504s on this item's METADATA while serving its icon fine, so probing by id reads as
  # absent and it was nearly filed as having no art. The icon endpoint is the one that matters.
  - key: genesis-badge
    name: Genesis Badge
    icon_id: 1182285

  # --- Exceptional Hammers, one slot per boss ----------------------------------------
  - key: exceptional-hammer-belt
    name: Exceptional Hammer (Belt)
    icon_id: 2644204
  - key: exceptional-hammer-face
    name: Exceptional Hammer (Face Acc)
    icon_id: 2644205
  - key: exceptional-hammer-eye
    name: Exceptional Hammer (Eye Acc)
    icon_id: 2644206
  - key: exceptional-hammer-earrings
    name: Exceptional Hammer (Earrings)
    icon_id: 2644207
  - key: exceptional-hammer-medal
    name: Exceptional Hammer (Medal)
    icon_id: 2644208

  # --- Grindstones -------------------------------------------------------------------
  # Two item ids carry each grindstone name (2539003/2539004 and 2539001/2539002), the tradeable
  # and untradeable versions. The lower one is pinned; the art is the same either way.
  #
  # A boss can drop both, and which one it drops varies by DIFFICULTY: Kaling gives Life on the
  # lower modes and Faith on the higher ones. A table has no difficulty in it, so both are listed
  # on every boss that drops either. See the note above `tables` for why that way round.
  - key: grindstone-of-faith
    name: Grindstone of Faith
    icon_id: 2539003
    fungible: true
  - key: grindstone-of-life
    name: Grindstone of Life
    icon_id: 2539001
    fungible: true

  # --- Eternal armour boxes ----------------------------------------------------------
  # Unopened, so one is any other: what it turns into is decided when somebody opens it, and until
  # then the boxes sell at one rate. Hence `fungible`, even though each drops from a single boss.
  - key: eternal-armor-of-desire-box
    name: Eternal Armor of Desire Box
    icon_id: 2638066
    fungible: true
  - key: divine-eternal-armor-box
    name: Divine Eternal Armor Box
    icon_id: 2638064
    fungible: true
  - key: ferocious-beast-eternal-armor-box
    name: Ferocious Beast Eternal Armor Box
    icon_id: 2638065
    fungible: true
  - key: ancient-eternal-armor-box
    name: Ancient Eternal Armor Box
    icon_id: 2830306
    fungible: true
  - key: eternal-armor-of-oaths-box
    name: Eternal Armor of Oaths Box
    icon_id: 2639253
    fungible: true
  # Two ids carry this name with the same art. The lower one is pinned.
  - key: eternal-armor-of-radiance-box
    name: Eternal Armor of Radiance Box
    icon_id: 2831105
    icon_version: 269
    fungible: true
  - key: eternal-twisted-armor-box
    name: Eternal Twisted Armor Box
    icon_id: 2831106
    icon_version: 269
    fungible: true

  # --- Selection and ring boxes ------------------------------------------------------
  - key: mitras-rage-selection-box
    name: Mitra's Rage Selection Box
    icon_id: 2633927

  # --- The rings the boss ring boxes are opened for ----------------------------------
  # The tables list these rather than the Life / White Jade Boss Ring Box they come out of: the
  # box is a wrapper, and only these two levels of ring are worth anything, so a pool row saying
  # "ring box" would not say what was actually worth splitting.
  #
  # The ids are the base rings. A ring's LEVEL is not part of its item id, so the art is the
  # ring's, and the level lives in the name.
  - key: ring-of-restraint-4
    name: Ring of Restraint Lv. 4
    icon_id: 1113098
    per_member: HEROIC
  - key: continuous-ring-4
    name: Continuous Ring Lv. 4
    icon_id: 1113329
    per_member: HEROIC

  # --- Astra secondary material ------------------------------------------------------
  # The boss drop is the COUPON, which is the tradeable one. The vestige it redeems for is not, so
  # the coupon is the thing a party sells and splits, the same reasoning as the boss rings above.
  #
  # No `quantity`: how many drop is per (boss, difficulty), not per item, so one number on the item
  # could only ever be right for one boss. The counts and their bundling are in `tables` below.
  # What a party actually looted is typed on the pool row.
  #
  # Two ids carry this name with the same art. The lower one is pinned.
  # Instanced in Heroic: Reboot hands each member their own count and there is no pile to share
  # out. Pooled there, it had a Heroic night dividing coupons everybody already held and naming a
  # creditor for the shortfall.
  # The Heroic COUNT is a separate fact and not yet one we hold: see `pieces` below.
  - key: vestige-of-erion
    name: Vestige of Erion Coupon
    icon_id: 2831435
    icon_version: 269
    per_member: HEROIC

# What each boss drops. Keys on the left are catalog/bosses.yaml boss keys; a boss with no entry
# simply has no table recorded yet, which the UI says rather than showing an empty one.
#
# A table is per boss, not per (boss, difficulty), and the asymmetry is deliberate. An option
# nobody picks costs nothing, because a drop is only logged when one actually fell. An option that
# is not there is a drop that cannot be entered at all, which is what happened to the Grindstone of
# Life on Kaling. So where a drop is real on some modes and not others, it is listed.
#
# `worlds` is the exception, and only because a world is a fact we hold: see the flag's note above.
tables:
  # Pitched pieces drop on Hard and up (Chaos for Gloom), and Total Control on Extreme only.
  lotus:
    - berserked
    - total-control

  damien:
    - magic-eyepatch

  lucid:
    - dreamy-belt

  will:
    - wills-cursed-spellbook-selection-box

  gloom:
    - endless-terror

  verus-hilla:
    - source-of-suffering

  darknell:
    - commanding-force-earring

  limbo:
    - whisper-of-the-source
    - grindstone-of-life
    - grindstone-of-faith
    - eternal-armor-of-desire-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        HARD: { total: 60, bundles: 3 }

  chosen-seren:
    - exceptional-hammer-face
    - mitras-rage-selection-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        EXTREME: { total: 30, bundles: 6 }

  kalos-the-guardian:
    - exceptional-hammer-eye
    - grindstone-of-life
    - divine-eternal-armor-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        EXTREME: { total: 180, bundles: 6 }

  kaling:
    - exceptional-hammer-earrings
    - grindstone-of-life
    - grindstone-of-faith
    - ferocious-beast-eternal-armor-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        HARD: { total: 60, bundles: 6 }
        EXTREME: { total: 480, bundles: 6 }

  first-adversary:
    - immortal-legacy
    - exceptional-hammer-medal
    - grindstone-of-life
    - ancient-eternal-armor-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        HARD: { total: 30, bundles: 3 }
        EXTREME: { total: 240, bundles: 3 }

  malefic-star:
    - blissful-nightmare
    - grindstone-of-life
    - grindstone-of-faith
    - eternal-armor-of-radiance-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        HARD: { total: 90, bundles: 3 }

  jupiter:
    - original-sin-of-pride
    - grindstone-of-life
    - grindstone-of-faith
    - eternal-twisted-armor-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        NORMAL: { total: 45, bundles: 3 }
        HARD: { total: 360, bundles: 3 }

  baldrix:
    - oath-of-death
    - grindstone-of-life
    - grindstone-of-faith
    - eternal-armor-of-oaths-box
    - ring-of-restraint-4
    - continuous-ring-4
    - key: vestige-of-erion
      pieces:
        HARD: { total: 120, bundles: 3 }

  # The belt hammer is Extreme only, which a table cannot say, so by the rule above it is listed
  # rather than left out. The other three drop on Hard as well.
  black-mage:
    - genesis-badge
    - exceptional-hammer-belt
    - ring-of-restraint-4
    - continuous-ring-4
